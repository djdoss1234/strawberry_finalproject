<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="100%" height="100%" fill="#f5f7fb"/>

<style>
  text{font-family:'Inter','Noto Sans CJK KR','NanumGothic','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;}
  .title{font-size:38px;font-weight:850;fill:#111827;}
  .subtitle{font-size:18px;fill:#64748b;}
  .section{font-size:22px;font-weight:800;fill:#111827;}
  .cardTitle{font-size:16px;font-weight:750;fill:#475569;letter-spacing:.2px;}
  .big{font-size:42px;font-weight:900;fill:#111827;}
  .num{font-size:25px;font-weight:850;fill:#111827;}
  .small{font-size:14px;fill:#64748b;}
  .tiny{font-size:12px;fill:#64748b;}
  .label{font-size:15px;font-weight:750;fill:#334155;}
  .panel{fill:#ffffff;stroke:#dbe3ee;stroke-width:1.2;}
  .card{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1;}
  .grid{stroke:#e7edf5;stroke-width:1;}
</style>

<text x="58" y="60" class="title">Motion KPI Dashboard</text>
<text x="58" y="91" class="subtitle">접근-파지 시간 단축 · planning workload · task execution timeline</text>
