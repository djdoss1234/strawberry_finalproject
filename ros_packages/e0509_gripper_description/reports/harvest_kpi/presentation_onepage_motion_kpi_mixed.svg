<text x="1084" y="334" class="section">Why This Motion?</text>
<text x="1086" y="374" class="label">Problem</text>
<text x="1176" y="374" class="small">spline-only 접근은 자세가 흔들리고 줄기 파지점이 어긋남</text>
<text x="1086" y="406" class="label">Change 1</text>
<text x="1176" y="406" class="small">straight approach 후, open gripper 상태로 짧게 하강</text>
<text x="1086" y="438" class="label">Change 2</text>
<text x="1176" y="438" class="small">검증된 0° grasp orientation 우선 적용</text>
<text x="1086" y="470" class="label">Change 3</text>
<text x="1176" y="470" class="small">wait/check timeout 축소로 cycle 병목 제거</text>
<text x="1086" y="502" class="label">Limit</text>
<text x="1176" y="502" class="small">thin stem 자동 파지 판정은 threshold 재보정 필요</text>
