.title{font:700 28px Arial, sans-serif;fill:#15171a}.subtitle{font:15px Arial,sans-serif;fill:#667085}.axis{stroke:#2b2f36;stroke-width:1.4}.grid{stroke:#edf0f4;stroke-width:1}.tick{font:13px Arial,sans-serif;fill:#667085}.label{font:600 16px Arial,sans-serif;fill:#2b2f36}.small{font:13px Arial,sans-serif;fill:#667085}.value{font:700 20px Arial,sans-serif}.card{fill:#f8fafc;stroke:#e5e7eb;stroke-width:1}.good{fill:#16a34a}.blue{fill:#2563eb}.amber{fill:#f59e0b}.red{fill:#dc2626}.violet{fill:#7c3aed}.dark{fill:#111827}
