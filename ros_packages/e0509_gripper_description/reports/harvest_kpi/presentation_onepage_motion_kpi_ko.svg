<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="100%" height="100%" fill="#f5f7fb"/>

<style>
  text{font-family:'Noto Sans CJK KR','NanumGothic','Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;}
  .title{font-size:34px;font-weight:800;fill:#111827;}
  .sub{font-size:17px;fill:#64748b;}
  .card-title{font-size:17px;font-weight:700;fill:#334155;}
  .card-value{font-size:34px;font-weight:850;fill:#111827;}
  .small{font-size:14px;fill:#64748b;}
  .label{font-size:17px;font-weight:700;fill:#1f2937;}
  .axis{stroke:#334155;stroke-width:1.5;}
  .grid{stroke:#e5e7eb;stroke-width:1;}
  .panel{fill:#ffffff;stroke:#dbe3ee;stroke-width:1.2;}
  .soft{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1;}
</style>

<text x="54" y="58" class="title">모션 플래닝 KPI 요약</text>
<text x="54" y="88" class="sub">로그 기반 단일 시연 분석 · 접근/파지 시간 단축, planning 계산량, task timeline을 한 장으로 요약</text>
<rect x="54" y="118" width="350" height="120" rx="20" class="panel"/>
<text x="78" y="152" class="card-title">접근-파지 평균</text>
<text x="78" y="196" class="card-value" fill="#2563eb">15.1초</text>
<text x="78" y="222" class="small">기존 36.4초 대비</text>
<rect x="436" y="118" width="350" height="120" rx="20" class="panel"/>
