<text x="608" y="540" class="small">총 36회 계획 호출 · 실패 branch를 빠르게 거절하지만 반복 호출이 병목</text>
<rect x="1062" y="270" width="484" height="290" rx="22" class="panel"/>
<text x="1086" y="308" class="label">무엇을 바꿨나</text>
<text x="1088" y="348" style="font-size:15px;font-weight:800;fill:#111827;">① 파지 모션</text>
<text x="1184" y="348" class="small">spline 직행 → 직선 진입 → 열린 그리퍼 하강 후 KP1 근처 close</text>
<text x="1088" y="386" style="font-size:15px;font-weight:800;fill:#111827;">② 후보 탐색</text>
<text x="1184" y="386" class="small">검증된 0° 자세 우선, 실패 branch는 빠르게 거절</text>
<text x="1088" y="424" style="font-size:15px;font-weight:800;fill:#111827;">③ 대기 시간</text>
<text x="1184" y="424" class="small">close 대기 1.5초→0.3초, grasp check timeout 20초→5초</text>
<text x="1088" y="462" style="font-size:15px;font-weight:800;fill:#111827;">④ place</text>
<text x="1184" y="462" class="small">시연용 slot sequence 0→1→3, row2 불안정 구간 회피</text>
<text x="1088" y="500" style="font-size:15px;font-weight:800;fill:#111827;">⑤ 안전/한계</text>
<text x="1184" y="500" class="small">자동 파지 판정은 얇은 줄기 조건에서 추가 보정 필요</text>
<rect x="54" y="590" width="1492" height="250" rx="22" class="panel"/>
