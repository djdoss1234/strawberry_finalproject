whiteboard:
  frame_id: whiteboard_frame
  dimensions_m:
    width: 1.500
    height: 0.900
    thickness: 0.020

workspace:
  frame_id: cultivation_panel
  parent_frame_id: whiteboard_frame
  origin_definition: tape_intersection_on_paper_workspace
  bounds_m:
    min_x: -0.545
    max_x: 0.555
    min_y: -0.405
    max_y: 0.395
  root_split_m:
    x: 0.0
    y: 0.0
  offset_from_whiteboard_top_left_m:
    x: 0.182
    y: 0.080
  max_depth: 3

measurements:
  recorded_date: "2026-05-26"
  construction: four_paper_cells_fixed_with_internal_and_outer_insulation_tape
  outer_workspace_m:
    width: 1.100
    height: 0.800
  board_margin_check_m:
    horizontal_total: 1.510  # 0.182 + 1.100 + 0.228; 10 mm over board width.
    vertical_total: 0.905    # 0.080 + 0.800 + 0.025; 5 mm over board height.
  provided_cell_sizes_m:
    west_width: 0.515
    east_width: 0.520
    north_height: 0.365
    south_height: 0.365
  cell_size_interpretation: paper_visible_or_usable_cell_area_excluding_tape_bands
  tape_band_width_m:
    approximate: 0.020
    use_for_motion_safety_margin: false
  precise_tape_margin_measurement_required: true
  note: >-
    The four paper cells are joined and attached to the whiteboard with
    insulation tape. The mismatch between outer workspace size and visible
    cell-size sums is consistent with the observed approximately 20 mm
    internal/outer tape bands. Use measured outer bounds and the
    tape-intersection root split for the root map. The approximate tape width
    is evidence for the dead-zone interpretation, not a precise motion safety
    margin.

scan_policy:
  initial_subdivision_depth: 1
  revisit_states:
    - OCCLUDED
    - PLANNING_FAIL
  terminal_states:
    - SCANNED_EMPTY
    - HARVESTED

# The exact camera stand-off distance and orientation will be measured after
# the overview camera pose is fixed.
scan_pose:
  standoff_m: null
  orientation_xyzw: null
  preview_standoff_m: 0.921486
  preview_source: measured_overview_camera_distance_along_panel_normal
  validated_for_motion: false
