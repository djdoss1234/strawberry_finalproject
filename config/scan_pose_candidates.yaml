#   Frame difference caused camera to face ~-X instead of +Y.
# v6 fix: R_TCP_NEW = FK_gripper_rh_p12_rn_base(overview_joints).
#   Camera Z in base = [0.039, 0.998, -0.043]: faces the panel (+Y). ✓
# NW/NE/SW: panel_normal 0.65 m.
# SE: panel_normal IK_FAIL (all standoffs exceed J5/J6 op limits); base_neg_y 0.40 m PLAN_VALID.
scan_pose_candidates:
  version: v6
  status: curobo_dry_run_validated
  capture_date: "2026-05-27"
  curobo_dry_run_date: "2026-05-27"
