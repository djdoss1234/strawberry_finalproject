curobo_scan_branch_optimization:
  run_date: '2026-06-02'
  source_candidates: config/scan_pose_candidates_refit_candidate.yaml
  source_world: config/scan_collision_world.yaml
  description: Offline cuRobo IK branch optimization with v12 TCP transforms fixed.
    No robot motion is executed by this script.
  operator_context:
    gripper_centered_reteach_reason: >-
      The previous camera-centered scan poses gave good image framing but did
      not guarantee a convenient grasp approach. After mounting an approximately
      15.8cm 3D-printed strawberry grasping attachment, the scan poses were
      retaught so the gripper is horizontally aligned with each cell working
      area, not merely so the optical center points at the cell center.
    execution_policy_at_time_of_run: >-
      This optimization was diagnostic/offline only. The runtime scan sequence
      still executes verified YAML endpoint_joints_deg with Doosan MoveJoint.
      J1/J4/J6 are rewritten at dispatch time to the nearest 360-degree
      equivalent branch based on current joint state.
    curobo_optimization_principle: >-
      For each fixed taught TCP transform, cuRobo is used to sample feasible IK
      branches. A dynamic-programming sequence search then chooses one candidate
      per cell to minimize joint travel, maximum single-joint swing, wrist
      rotation, joint-limit pressure, and deviation from the manually taught
      pose. This is branch selection, not yet online trajectory execution.
    current_limitation: >-
      Exact TCP-pose branch optimization gives limited alternatives. The next
      useful step is tolerance sampling around the taught pose (small xyz/rpy
      offsets) plus updated collision spheres for the 15.8cm gripper attachment.
      Until that is verified, do not apply these candidates directly to
      unattended robot execution.
